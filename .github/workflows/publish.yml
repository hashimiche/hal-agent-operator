name: Publish

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OPERATOR_IMAGE: ghcr.io/hashimiche/hal-k8s-operator
  FIX_IMAGE: ghcr.io/hashimiche/hal-k8s-operator-fix
  CHART_OCI: oci://ghcr.io/hashimiche/charts

jobs:
  publish:
    name: Build images and push Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "Tag must start with v (got: $TAG)" >&2
            exit 1
          fi
          CHART_VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push operator image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: operator
          platforms: linux/amd64
          push: true
          tags: ${{ env.OPERATOR_IMAGE }}:${{ steps.meta.outputs.tag }}

      - name: Build and push fix image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: fix
          platforms: linux/amd64
          push: true
          tags: ${{ env.FIX_IMAGE }}:${{ steps.meta.outputs.tag }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1


      - name: Package and push Helm chart
        run: |
          helm package charts/hal-k8s-operator \
            --version "${{ steps.meta.outputs.chart_version }}" \
            --app-version "${{ steps.meta.outputs.tag }}"
          helm push "hal-k8s-operator-${{ steps.meta.outputs.chart_version }}.tgz" "${{ env.CHART_OCI }}"
