name: Publish

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OPERATOR_IMAGE: ghcr.io/hashimiche/hal-k8s-operator
  FIX_IMAGE: ghcr.io/hashimiche/hal-k8s-operator-fix
  CHART_OCI: oci://ghcr.io/hashimiche/charts

jobs:
  publish:
    name: Build images and push Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "Tag must start with v (got: $TAG)" >&2
            exit 1
          fi
          CHART_VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318fb6c203bef6545949c3996b9d97751 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532ce9ef3972bd5a39fd3a2d6c4c33 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push operator image
        uses: docker/build-push-action@14487c786b4fc4823d5662672a2479a3caa77d83 # v6.16.0
        with:
          context: .
          file: Dockerfile
          target: operator
          platforms: linux/amd64
          push: true
          tags: ${{ env.OPERATOR_IMAGE }}:${{ steps.meta.outputs.tag }}

      - name: Build and push fix image
        uses: docker/build-push-action@14487c786b4fc4823d5662672a2479a3caa77d83 # v6.16.0
        with:
          context: .
          file: Dockerfile
          target: fix
          platforms: linux/amd64
          push: true
          tags: ${{ env.FIX_IMAGE }}:${{ steps.meta.outputs.tag }}

      - name: Install Helm
        uses: azure/setup-helm@51138f6619c67be0414e2d3495e6e0f0f5c45a54 # v4.2.0

      - name: Package and push Helm chart
        run: |
          helm package charts/hal-k8s-operator \
            --version "${{ steps.meta.outputs.chart_version }}" \
            --app-version "${{ steps.meta.outputs.tag }}"
          helm push "hal-k8s-operator-${{ steps.meta.outputs.chart_version }}.tgz" "${{ env.CHART_OCI }}"
