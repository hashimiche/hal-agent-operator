# Default values for local KinD POC.
# Namespace is owned by Helm's --namespace / --create-namespace (not a chart template).

image:
  repository: hal-k8s-operator
  tag: poc
  pullPolicy: IfNotPresent

# Same image runs /manager (operator) and /triage (Job).
triage:
  image: "" # default: image.repository:image.tag
  # Default model — keep in sync with internal/defaults.GeminiModel.
  # Rolling alias: pinned IDs (e.g. gemini-2.5-flash) get retired for new API
  # keys ahead of schedule and return 404. Override with a pinned ID via
  # --set triage.model=... if you need reproducible outputs.
  model: gemini-3.1-flash-lite

# Gemini API key for triage Jobs (POC: plain K8s Secret, not Vault yet).
gemini:
  secretName: gemini-api
  secretKey: GEMINI_API_KEY
  # Set via --set gemini.apiKey=$GEMINI_API_KEY (do not commit).
  apiKey: ""
  # If true and apiKey is set, create the Secret from values.
  createSecret: true

operator:
  replicaCount: 1
  leaderElect: false
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

serviceAccount:
  create: true
  name: hal-k8s-operator

# Install sample IssueResolution CR (false by default — apply manually).
sample:
  enabled: false
