# Default values for local KinD POC.
# Namespace is owned by Helm's --namespace / --create-namespace (not a chart template).

image:
  repository: hal-k8s-operator
  tag: poc
  pullPolicy: IfNotPresent

# Same image runs /manager (operator) and /triage (Job).
triage:
  image: "" # default: image.repository:image.tag
  # Default model — keep in sync with internal/defaults.GeminiModel.
  # Pinned id (not the rolling gemini-flash-latest alias): the alias caused
  # intermittent model-unavailability errors, so we pin for stability and bump
  # this manually as newer Flash-Lite versions ship. Override per-install with
  # --set triage.model=... if needed.
  model: gemini-3.1-flash-lite

# Fix Job image (separate: needs Go toolchain; not distroless).
fix:
  image: "hal-k8s-operator-fix:poc"

# Gemini API key for triage/fix Jobs (POC: plain K8s Secret, not Vault yet).
gemini:
  secretName: gemini-api
  secretKey: GEMINI_API_KEY
  # Set via --set gemini.apiKey=$GEMINI_API_KEY (do not commit).
  apiKey: ""
  # If true and apiKey is set, create the Secret from values.
  createSecret: true

# GitHub fine-grained PAT for triage + fix Jobs (fork only).
# POC: one Secret shared by both Jobs. Target (Vault T15): separate short-TTL
# tokens — Job 1 issues:write; Job 2 contents:write + pull_requests:write.
# Scopes for the shared POC PAT: issues:write + contents:write + pull_requests:write.
# Never merge/admin.
github:
  secretName: github-pat
  secretKey: GITHUB_TOKEN
  # Set via --set github.token=$GITHUB_TOKEN (do not commit).
  token: ""
  createSecret: true

# Reserved for nested-container runtimes (e.g. gVisor on GKE). Empty = cluster default.
runtimeClassName: ""

operator:
  replicaCount: 1
  leaderElect: false
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

serviceAccount:
  create: true
  name: hal-k8s-operator

# Install sample IssueResolution CR (false by default — apply manually).
sample:
  enabled: false
