# Default values for local KinD POC.
# Namespace is owned by Helm's --namespace / --create-namespace (not a chart template).

image:
  repository: hal-k8s-operator
  tag: poc
  pullPolicy: IfNotPresent

# Same image runs /manager (operator) and /triage (Job).
triage:
  image: "" # default: image.repository:image.tag
  # Default model — keep in sync with internal/defaults.GeminiModel.
  # Pinned id (not the rolling gemini-flash-latest alias): the alias caused
  # intermittent model-unavailability errors, so we pin for stability and bump
  # this manually as newer Flash-Lite versions ship. Override per-install with
  # --set triage.model=... if needed.
  model: gemini-3.1-flash-lite

# Fix Job image (separate: needs Go toolchain; not distroless).
fix:
  image: "hal-k8s-operator-fix:poc"

# Gemini API key for triage/fix Jobs.
# KinD POC: createSecret true + --set gemini.apiKey (Helm renders Secret gemini-api).
# GKE: use values-ghcr.yaml (createSecret false); VSO VaultStaticSecret syncs gemini-api.
gemini:
  secretName: gemini-api
  secretKey: GEMINI_API_KEY
  # KinD only — --set gemini.apiKey=$GEMINI_API_KEY (do not commit).
  apiKey: ""
  createSecret: true

# GitHub token for triage + fix Jobs (fork only).
# KinD POC: createSecret true + --set github.token (Helm renders Secret github-pat).
# GKE: use values-ghcr.yaml (createSecret false); VSO syncs github-pat from Vault.
# POC PAT scopes: issues:write + contents:write + pull_requests:write. Never merge/admin.
github:
  secretName: github-pat
  secretKey: GITHUB_TOKEN
  # KinD only — --set github.token=$GITHUB_TOKEN (do not commit).
  token: ""
  createSecret: true

# Reserved for nested-container runtimes (e.g. gVisor on GKE). Empty = cluster default.
runtimeClassName: ""

# Job egress NetworkPolicy (hal.dev/job-role=triage|fix). Off for KinD
# (kindnet often does not enforce); enable on GKE via values-ghcr.yaml once
# the cluster NetworkPolicy addon (Calico) is on — see T14 runbook.
networkPolicy:
  enabled: false

operator:
  replicaCount: 1
  leaderElect: false
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

serviceAccount:
  create: true
  name: hal-k8s-operator

# Install sample IssueResolution CR (false by default — apply manually).
sample:
  enabled: false
