apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hal-k8s-operator.fullname" . }}
  labels:
    {{- include "hal-k8s-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["agent.hal.dev"]
    resources: ["issueresolutions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["agent.hal.dev"]
    resources: ["issueresolutions/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["agent.hal.dev"]
    resources: ["issueresolutions/finalizers"]
    verbs: ["update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hal-k8s-operator.fullname" . }}
  labels:
    {{- include "hal-k8s-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hal-k8s-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hal-k8s-operator.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
