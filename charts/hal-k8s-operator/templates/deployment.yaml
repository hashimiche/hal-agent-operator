apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hal-k8s-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hal-k8s-operator.labels" . | nindent 4 }}
    {{- include "hal-k8s-operator.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      {{- include "hal-k8s-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hal-k8s-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "hal-k8s-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "hal-k8s-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --leader-elect={{ .Values.operator.leaderElect }}
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
            - --triage-image={{ include "hal-k8s-operator.triageImage" . }}
            - --gemini-secret-name={{ .Values.gemini.secretName }}
            - --gemini-secret-key={{ .Values.gemini.secretKey }}
            - --gemini-model={{ .Values.triage.model }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
