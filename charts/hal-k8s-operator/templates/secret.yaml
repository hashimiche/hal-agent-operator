{{- if and .Values.claude.createSecret .Values.claude.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.claude.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hal-k8s-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.claude.secretKey }}: {{ .Values.claude.apiKey | quote }}
{{- end }}
