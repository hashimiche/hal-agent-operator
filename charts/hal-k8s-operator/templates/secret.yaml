{{- if and .Values.gemini.createSecret .Values.gemini.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gemini.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hal-k8s-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.gemini.secretKey }}: {{ .Values.gemini.apiKey | quote }}
{{- end }}
