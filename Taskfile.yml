# User-facing entry point for the POC (go-task — https://taskfile.dev).
# The Makefile remains the internal Kubebuilder engine (manifests/generate/envtest):
# dev tasks delegate to make, KinD tasks are self-contained.
version: '3'

vars:
  KIND_POC_CLUSTER: hal-agent
  IMG_POC: hal-k8s-operator:poc
  IMG_FIX_POC: hal-k8s-operator-fix:poc
  CONTAINER_TOOL:
    sh: command -v docker >/dev/null 2>&1 && echo docker || echo podman
  # kind reads KIND_EXPERIMENTAL_PROVIDER ("" = docker auto-detection)
  KIND_PROVIDER: '{{if eq .CONTAINER_TOOL "podman"}}podman{{end}}'

env:
  KIND_EXPERIMENTAL_PROVIDER: '{{.KIND_PROVIDER}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  prereqs:
    desc: Check required tools and the Gemini API key
    cmds:
      - |
        ok=1
        for t in {{.CONTAINER_TOOL}} kind kubectl helm go; do
          if command -v $t >/dev/null 2>&1; then printf '%-16s OK\n' $t
          else printf '%-16s MISSING\n' $t; ok=0; fi
        done
        if [ -n "$GEMINI_API_KEY" ]; then printf '%-16s OK\n' GEMINI_API_KEY
        else printf '%-16s MISSING (export GEMINI_API_KEY=...)\n' GEMINI_API_KEY; ok=0; fi
        echo "container tool : {{.CONTAINER_TOOL}}"
        [ $ok -eq 1 ]
    silent: true

  kind-poc-cluster:
    desc: Create the POC KinD cluster (idempotent, IPv4-only)
    cmds:
      - |
        if kind get clusters 2>/dev/null | grep -qx '{{.KIND_POC_CLUSTER}}'; then
          echo "cluster {{.KIND_POC_CLUSTER}} already exists"
        else
          kind create cluster --name {{.KIND_POC_CLUSTER}} --config config/kind/hal-agent.yaml
        fi
      - task: kind-poc-dns

  kind-poc-dns:
    desc: Patch CoreDNS for KinD/Podman (IPv4 upstream, suppress AAAA)
    cmds:
      - |
        # Podman+WSL2: /etc/resolv.conf often points at an unreachable IPv6
        # resolver, and AAAA answers make Go/Gemini dial IPv6 → ENETUNREACH.
        kubectl --context kind-{{.KIND_POC_CLUSTER}} -n kube-system apply -f - <<'EOF'
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: coredns
          namespace: kube-system
        data:
          Corefile: |
            .:53 {
                errors
                health {
                   lameduck 5s
                }
                ready
                template ANY AAAA {
                   rcode NOERROR
                }
                kubernetes cluster.local in-addr.arpa ip6.arpa {
                   pods insecure
                   fallthrough in-addr.arpa ip6.arpa
                   ttl 30
                }
                prometheus :9153
                forward . 8.8.8.8 1.1.1.1 {
                   max_concurrent 1000
                }
                cache 30 {
                   disable success cluster.local
                   disable denial cluster.local
                }
                loop
                reload
                loadbalance
            }
        EOF
        kubectl --context kind-{{.KIND_POC_CLUSTER}} -n kube-system rollout restart deployment/coredns
        kubectl --context kind-{{.KIND_POC_CLUSTER}} -n kube-system rollout status deployment/coredns --timeout=90s

  kind-poc-image:
    desc: Build operator + fix images and load them into KinD (docker or podman)
    cmds:
      - |
        # BuildKit-style ARGs can be empty under podman without defaults in Dockerfile.
        # Operator/triage = distroless target; fix = golang toolchain target.
        # IMPORTANT (podman): never `podman save A B` into one archive for
        # `kind load image-archive` — containerd can tag both names to the same
        # image ID (operator wins → fix Job: exec /fix: no such file).
        if [ "{{.CONTAINER_TOOL}}" = "podman" ]; then
          # Fully qualified name: otherwise containerd (inside KinD) cannot
          # resolve the image referenced as "hal-k8s-operator:poc".
          podman build --format docker --target operator -t docker.io/library/{{.IMG_POC}} .
          podman build --format docker --target fix -t docker.io/library/{{.IMG_FIX_POC}} .
          for img in docker.io/library/{{.IMG_POC}} docker.io/library/{{.IMG_FIX_POC}}; do
            tmp=$(mktemp /tmp/hal-poc-img-XXXXXX.tar)
            podman save "$img" -o "$tmp"
            kind load image-archive "$tmp" --name {{.KIND_POC_CLUSTER}}
            rm -f "$tmp"
          done
        else
          docker build --target operator -t {{.IMG_POC}} .
          docker build --target fix -t {{.IMG_FIX_POC}} .
          kind load docker-image {{.IMG_POC}} {{.IMG_FIX_POC}} --name {{.KIND_POC_CLUSTER}}
        fi

  kind-poc-helm:
    desc: Deploy the operator via Helm (requires GEMINI_API_KEY + GITHUB_TOKEN + KinD cluster)
    preconditions:
      - sh: test -n "$GEMINI_API_KEY"
        msg: 'export GEMINI_API_KEY=... first (https://aistudio.google.com/apikey)'
      - sh: test -n "$GITHUB_TOKEN"
        msg: 'export GITHUB_TOKEN=... first (fine-grained PAT: issues:write [+ contents/PR write for Job 2])'
      - sh: kind get clusters 2>/dev/null | grep -qx '{{.KIND_POC_CLUSTER}}'
        msg: 'KinD cluster {{.KIND_POC_CLUSTER}} not found — run: task kind-poc-cluster'
      - sh: kubectl --context kind-{{.KIND_POC_CLUSTER}} get nodes >/dev/null 2>&1
        msg: 'KinD cluster {{.KIND_POC_CLUSTER}} exists but API is unreachable (node/pod down?) — recreate with: task kind-poc-clean && task kind-poc-cluster'
    cmds:
      - |
        # Namespace via --create-namespace only (no Namespace object in the chart),
        # so re-runs stay idempotent when hal-agent already exists.
        # github.token → Secrets github-triage + github-fix (same PAT on KinD).
        helm upgrade --install hal-agent ./charts/hal-k8s-operator \
          --namespace hal-agent --create-namespace \
          --set image.repository=hal-k8s-operator \
          --set image.tag=poc \
          --set image.pullPolicy=IfNotPresent \
          --set fix.image=hal-k8s-operator-fix:poc \
          --set gemini.apiKey="$GEMINI_API_KEY" \
          --set github.token="$GITHUB_TOKEN" \
          {{.CLI_ARGS}}

  kind-poc:
    desc: Full pipeline — cluster + image + helm (then POC.md steps 4–8 for Job 2)
    cmds:
      - task: kind-poc-cluster
      - task: kind-poc-image
      - task: kind-poc-helm
      - cmd: echo "Next -> POC.md steps 4–8 (CR issue-5, triage, approve, fix Job, PROpen)"
        silent: true

  kind-poc-clean:
    desc: Remove the Helm release and the KinD cluster
    cmds:
      - helm uninstall hal-agent -n hal-agent || true
      - kind delete cluster --name {{.KIND_POC_CLUSTER}}

  # --- Dev (delegates to the Kubebuilder Makefile) ---

  build:
    desc: Build manager + triage binaries
    cmds: [make build]

  test:
    desc: Unit tests (envtest)
    cmds: [make test]

  lint-fix:
    desc: Lint with auto-fix
    cmds: [make lint-fix]

  manifests:
    desc: Regenerate CRDs/RBAC from markers
    cmds: [make manifests]

  generate:
    desc: Regenerate DeepCopy code
    cmds: [make generate]
